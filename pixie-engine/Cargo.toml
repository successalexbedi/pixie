[package]
name = "pixie-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
taffy = "0.7"
cosmic-text = "0.12"
wgpu = "24"
winit = "0.30"
pollster = "0.3"
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
pixie-style = { path = "../pixie-style" }
pixie-node = { path = "../pixie-node" }

[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30", features = ["android-native-activity"] }
